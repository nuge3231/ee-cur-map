<script>
'use strict';
const courses=JSON.parse(document.getElementById('course-data').textContent);
const byId=new Map(courses.map(c=>[c.id,c]));
const order={전기:[1,3,5,37,9,4,8,15],중기:[7,20,27,29,31,21,2,23,13,10,36,19,33],후기:[30,32,16,24,22,25,26,14,17,18,6,28,38,12,34,11,35]};
const fields=[['기초·공통','#E8ECF2','#53657B'],['컴퓨터·임베디드','#EEE4FA','#7950A4'],['전자회로','#DDEBFC','#3770A8'],['전력·에너지','#DEF0DE','#44804F'],['전자기·재료','#F9E8D5','#A57035'],['제어·자동화','#F7E0EB','#AC527A'],['신호처리','#DDF3F6','#328797']];
const colors=new Map(fields.map(([name,tint,ink])=>[name,{tint,ink}]));
const stages=['전기','중기','후기'];const state={selected:null,hover:null};
const nodes=new Map();let edges=[];let edgeFrame=0;
const $=id=>document.getElementById(id);
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function tag(c){return c.required?'<span class="badge required">전공필수</span>':c.core?'<span class="badge core">공통 핵심 권장</span>':'<span>전공선택</span>';}
function ancestors(id){const found=new Set([id]);const visit=n=>{for(const p of byId.get(n).pre)if(!found.has(p)){found.add(p);visit(p);}};visit(id);return found;}
function descendants(id){const found=new Set([id]);const visit=p=>{for(const c of courses)if(c.pre.includes(p)&&!found.has(c.id)){found.add(c.id);visit(c.id);}};visit(id);return found;}
function pathFor(id){return new Set([...ancestors(id),...descendants(id)]);}
function updateHighlights(){const focus=state.hover??state.selected;const active=focus===null?new Set(courses.map(c=>c.id)):pathFor(focus);for(const c of courses){const n=nodes.get(c.id);n.classList.toggle('dim',focus!==null&&!active.has(c.id));n.classList.toggle('selected',state.selected===c.id);n.classList.toggle('is-related',focus!==null&&active.has(c.id)&&c.id!==focus);n.setAttribute('aria-pressed',String(state.selected===c.id));}for(const e of edges){const on=active.has(e.from)&&active.has(e.to);e.el.classList.toggle('active',focus!==null&&on);e.el.classList.toggle('faded',focus!==null&&!on);}}
function renderCourses(){
 $('lanes').innerHTML=fields.map(([field,,ink])=>`<section class="lane" aria-label="${field}" style="--field-ink:${ink}"><div class="lane-label">${field}</div><div class="lane-grid">${stages.map(stage=>`<div class="stage-cell" data-stage="${stage}">${order[stage].map(id=>byId.get(id)).filter(c=>c.field===field).map(c=>{const color=colors.get(c.field);return `<button type="button" id="course-${c.id}" class="course ${c.core?'is-core':''}" data-course="${c.id}" aria-label="${escapeHtml(c.name)}, ${stage}, ${c.required?'전공필수':c.core?'전공선택, 공통 핵심 권장':'전공선택'}" aria-pressed="false" style="--tint:${color.tint};--ink:${color.ink}"><strong>${escapeHtml(c.name)}</strong><span class="course-meta">${tag(c)}<span>${c.credits}학점</span>${c.lab?'<span class="lab">실습</span>':''}</span></button>`;}).join('')}</div>`).join('')}</div></section>`).join('');
 for(const c of courses){const n=$(`course-${c.id}`);nodes.set(c.id,n);n.addEventListener('pointerenter',()=>{if(state.selected===null){state.hover=c.id;updateHighlights();}});n.addEventListener('pointerleave',()=>{if(state.selected===null){state.hover=null;updateHighlights();}});n.addEventListener('focus',()=>{if(state.selected===null){state.hover=c.id;updateHighlights();}});n.addEventListener('blur',()=>{if(state.selected===null){state.hover=null;updateHighlights();}});}
}
function drawEdges(){
 const svg=$('connections'),board=$('board'),br=board.getBoundingClientRect();const scale=br.width/board.offsetWidth||1;const rect=id=>{const r=nodes.get(id).getBoundingClientRect();return{left:(r.left-br.left)/scale,right:(r.right-br.left)/scale,top:(r.top-br.top)/scale,height:r.height/scale};};const width=board.scrollWidth,height=board.scrollHeight;svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('width',width);svg.setAttribute('height',height);
 let markup='<defs>'+fields.map(([field,,ink],i)=>`<marker id="arrow-${i}" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8" fill="${ink}"/></marker>`).join('')+'</defs>';edges=[];
 for(const c of courses)for(let i=0;i<c.pre.length;i++){
  const parent=byId.get(c.pre[i]),a=rect(parent.id),b=rect(c.id);const same=parent.stage===c.stage;let path;
  if(same){const x=a.right,y=a.top+a.height/2,ty=b.top+b.height/2;const gutter=x+12+(i%3)*5;path=`M ${x} ${y} H ${gutter} V ${ty} H ${b.right+2}`;}
  else{const x=a.right+2,y=a.top+a.height/2,tx=b.left-3,ty=b.top+b.height/2;const mid=x+16+(i%3)*5;path=Math.abs(y-ty)<3?`M ${x} ${y} H ${tx}`:`M ${x} ${y} H ${mid} V ${ty} H ${tx}`;}
  const parallel=c.extra.includes('병행 가능')&&parent.name.replaceAll(' ','')===c.name.replace('실험','').replaceAll(' ','');const index=fields.findIndex(([f])=>f===c.field);const key=`edge-${parent.id}-${c.id}`;
  markup+=`<path id="${key}" class="edge${parallel?' parallel':''}" d="${path}" style="--edge:${colors.get(c.field).ink}" marker-end="url(#arrow-${index})"/>`;edges.push({key,from:parent.id,to:c.id});
 }
 svg.innerHTML=markup;for(const e of edges)e.el=$(e.key);updateHighlights();
}
function scheduleEdges(){cancelAnimationFrame(edgeFrame);edgeFrame=requestAnimationFrame(drawEdges);}
$('lanes').addEventListener('click',e=>{const b=e.target.closest('[data-course]');if(b){const id=Number(b.dataset.course);state.selected=state.selected===id?null:id;state.hover=null;updateHighlights();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){state.selected=null;state.hover=null;updateHighlights();}});
window.addEventListener('resize',scheduleEdges);window.addEventListener('beforeprint',drawEdges);window.addEventListener('afterprint',scheduleEdges);
renderCourses();new ResizeObserver(scheduleEdges).observe($('board'));document.fonts.ready.then(scheduleEdges);
</script>
</body>
